spring:
  jackson:
    default-property-inclusion: non_null
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${IT_DB_PASSWORD}
    hikari:
      initialization-fail-timeout: ${DB_INIT_FAIL_TIMEOUT:30000}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}
  cache:
    type: redis
    redis:
      cache-null-values: false
      time-to-live: ${CACHE_TTL:10m}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  error:
    include-message: never
    include-binding-errors: never

app:
  auth:
    jwt:
      hs256-secret: ${ADMIN_JWT_HS256_SECRET}
      exp-leeway: ${ADMIN_JWT_EXP_LEEWAY:30s}
  cache:
    published-ttl: ${PUBLISHED_CACHE_TTL:24h}

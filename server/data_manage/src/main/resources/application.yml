spring:
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_URL}
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: ${IT_DB_INIT_FAIL_TIMEOUT:30000}
mybatis:
  mapper-locations: "classpath*:mapper/**/*.xml"

app:
  startup:
    fail-fast: true
  auth:
    allowed-origins: ${APP_AUTH_ALLOWED_ORIGINS:https://localhost:5173}
    aead-keyset-path: ${APP_AUTH_AEAD_KEYSET_PATH:../../config/auth/aead-keyset.json}
    aead-key-id: ${APP_AUTH_AEAD_KEY_ID:auth-aead-1}
    grant-private-key-path: ${APP_AUTH_GRANT_PRIVATE_KEY_PATH:../../config/auth/grant-private.pk8}
    grant-key-id: ${APP_AUTH_GRANT_KEY_ID:wasm-1}
    internal-token-path: ${APP_AUTH_INTERNAL_TOKEN_PATH:../../config/auth/internal-token.txt}
    internal-trusted-addresses: ${APP_AUTH_INTERNAL_TRUSTED_ADDRESSES:127.0.0.1,::1}
    cleanup-enabled: ${APP_AUTH_CLEANUP_ENABLED:true}
  maintenance:
    socket-path: ${APP_MAINTENANCE_SOCKET_PATH:}
    dev-port: ${APP_MAINTENANCE_DEV_PORT:}
    principal-id: ${APP_MAINTENANCE_PRINCIPAL_ID:}
    allowed-origins: ${APP_MAINTENANCE_ALLOWED_ORIGINS:https://localhost:5174}
    deployment-token-path: ${APP_MAINTENANCE_DEPLOYMENT_TOKEN_PATH:../../config/auth/deployment-token.txt}
    validation-public-key-path: ${APP_MAINTENANCE_VALIDATION_PUBLIC_KEY_PATH:../../config/auth/validation-public.der}
    trusted-addresses: ${APP_MAINTENANCE_TRUSTED_ADDRESSES:127.0.0.1,::1}
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: none

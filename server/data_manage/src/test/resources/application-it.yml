spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${IT_DB_URL}
    username: ${IT_DB_USERNAME}
    password: ${IT_DB_PASSWORD}
    hikari:
      initialization-fail-timeout: ${IT_DB_INIT_FAIL_TIMEOUT:30000}
  data:
    redis:
      host: ${IT_REDIS_HOST:localhost}
      port: ${IT_REDIS_PORT:6379}
      password: ${IT_REDIS_PASSWORD}
      database: ${IT_REDIS_DATABASE:0}
      timeout: ${IT_REDIS_TIMEOUT:3s}
  cache:
    type: simple

app:
  startup:
    fail-fast: false
  auth:
    jwt:
      hs256-secret: ${IT_ADMIN_JWT_SECRET}
      exp-leeway: ${IT_ADMIN_JWT_EXP_LEEWAY:30s}

spring:
  datasource:
    username: postgres
    password: ${IT_DB_PASSWORD}
    url: jdbc:postgresql://100.107.31.39:5432/test0221
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: ${IT_DB_INIT_FAIL_TIMEOUT:30000}
  data:
    redis:
      host: ${IT_REDIS_HOST:120.79.255.240}
      port: ${IT_REDIS_PORT:6789}
      password: ${IT_REDIS_PASSWORD}
      database: ${IT_REDIS_DATABASE:1}
      timeout: ${IT_REDIS_TIMEOUT:3s}
  cache:
    type: redis

mybatis:
  mapper-locations: "classpath*:mapper/**/*.xml"

app:
  cache:
    ttl: ${APP_CACHE_TTL:1h}
  startup:
    fail-fast: false
  auth:
    jwt:
      disabled: ${APP_AUTH_JWT_DISABLED:false}
      es256-public-key-pem: ${IT_ADMIN_JWT_ES256_PUBLIC_KEY_PEM:}
      exp-leeway: ${IT_ADMIN_JWT_EXP_LEEWAY:30s}

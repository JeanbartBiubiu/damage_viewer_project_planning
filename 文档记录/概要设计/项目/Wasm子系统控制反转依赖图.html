      "risk": "监听执行能力，能力产生事件，再触发监听；若共享单个当前帧或重置预算会破坏因果。",
      "solution": "每次独立冻结列表、条件和恢复凭据，使用同一预算与明确深度，返回后复查活挂载。",
      "preserve": "不以异步事件总线或拒绝所有递归代替现有语义。",
      "type": "受控运行递归；不能按包循环处理"
    },
    {
      "id": "shared",
      "label": "共同契约反向依赖",
      "nodeIds": [
        "runtime/contract",
        "plan",
        "formula",
        "pipeline",
        "runtime/execution"
      ],
      "risk": "把所有接口与状态都搬进共同契约包，会引入新的反向依赖；该包当前已有下层依赖。",
      "solution": "协作接口优先放消费方；仅在实际产生反向引用时移动最小纯值到合适下层。",
      "preserve": "不为减少图上交叉线而批量搬类型。",
      "type": "潜在包依赖环"
    },
    {
      "id": "construct",
      "label": "双方构造互相等待",
      "nodeIds": [
        "runtime",
        "runtime/execution",
        "runtime/action",
        "runtime/effect"
      ],
      "risk": "A构造时调用未完成的B，B又需要A，可能暴露半初始化状态或无限等待。",
      "solution": "共同输入先准备，运行回调在开始执行时传入；无法拆开时调整责任并明确拒绝构造。",
      "preserve": "不使用提前曝光、空依赖、延迟代理或设置方法补环。",
      "type": "初始化失败应在开放运行前暴露"
    }
  ],
  "stages": [
    {
      "label": "实例启动",
      "detail": "固化策略、会话表与出箱；无战斗对象。"
    },
    {
      "label": "会话编译",
      "detail": "注册并绑定公式，生成只读计划和目录；成功才登记会话。"
    },
    {
      "label": "运行准入",
      "detail": "重新核验授权、身份、摘要、快照和时间范围。"
    },
    {
      "label": "本场构造",
      "detail": "先建唯一循环和所属状态，再装配执行消费者；不调用战斗回调。"
    },
    {
      "label": "原序准备",
      "detail": "保留准入、恢复、驱动公式、命中、额度、过程与来源初始化的现有先后。"
    },
    {
      "label": "完成装配",
      "detail": "最后追加与绑定后冻结公式运行能力，完成初始登记，再开放运行。"
    },
    {
      "label": "运行与交出",
      "detail": "Run(driver)开始；保留真实帧与同步尾部，按原规则交出报告。"
    }
  ],
  "references": [
    {
      "label": "DeepSeek官方入口",
      "url": "https://www.deepseek.com/en/harness/"
    },
    {
      "label": "DeepSeek架构（固定提交）",
      "url": "https://github.com/deepseek-ai/deepseek-harness/blob/fcc0ad462172522aaf5c93a7b2e01f6b9f0b0159/docs/architecture.md"
    },
    {
      "label": "Cordis依赖与生命周期",
      "url": "https://github.com/deepseek-ai/deepseek-harness/blob/fcc0ad462172522aaf5c93a7b2e01f6b9f0b0159/docs/cordis-primer.md"
    },
    {
      "label": "Spring依赖注入",
      "url": "https://docs.spring.io/spring-framework/reference/core/beans/introduction.html"
    },
    {
      "label": "Spring循环依赖",
      "url": "https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html#beans-dependency-resolution"
    }
  ],
  "constructionScopes": [
    {
      "id": "instance",
      "label": "实例启动",
      "detail": "仅授权策略、会话登记与字节运输；不等待本场循环和执行器。"
    },
    {
      "id": "compile",
      "label": "会话编译",
      "detail": "每次编译建立目录、公式主体与只读计划；数据产物不虚构服务。"
    },
    {
      "id": "run",
      "label": "单场装配",
      "detail": "借用已就绪会话产物，先建唯一循环和所属状态，再装配本场执行消费者。"
    }
  ]
}
</script>
<script>
"use strict";
(() => {
  const data=JSON.parse(document.getElementById("graph-data").textContent);
  const byId=new Map(data.nodes.map(node=>[node.id,node]));
  const families=["入口与规则","调度与组合","业务执行","执行支撑","状态所有者","公式与数值","稳定基础"];
   const state={mode:"runtime",selected:"formula",showAll:false,cycle:data.cycles[0].id,stage:0,scope:"run"};
  const el=id=>document.getElementById(id);
  const escape=value=>String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
  const label=id=>byId.get(id).label;
  const shortPath=id=>id==="host"?"正式宿主":id.replace(/^runtime\/execution\//,"").replace(/^runtime\//,"").replace(/^base\//,"");
  let frame=0;
  function acyclic(edges){const graph=new Map(data.nodes.map(node=>[node.id,[]]));for(const edge of edges)graph.get(edge.from).push(edge.to);const active=new Set(),done=new Set();function visit(id){if(active.has(id))return false;if(done.has(id))return true;active.add(id);for(const target of graph.get(id))if(!visit(target))return false;active.delete(id);done.add(id);return true}return data.nodes.every(node=>visit(node.id))}
  if(byId.size!==data.nodes.length||data.nodes.length-1!==data.productionPackages)throw new Error("子系统节点与生产包数量不一致");
  for(const edge of [...data.currentEdges,...data.constructionEdges,...data.runtimeEdges])if(!byId.has(edge.from)||!byId.has(edge.to))throw new Error("关系引用了未知子系统");
   if(!acyclic(data.currentEdges))throw new Error("现行包导入图存在循环");
   const scopeIds=new Set(data.constructionScopes.map(scope=>scope.id));
   if(data.constructionEdges.some(edge=>!scopeIds.has(edge.scope)))throw new Error("装配输入缺少合法作用域");
   for(const scope of data.constructionScopes)if(!acyclic(data.constructionEdges.filter(edge=>edge.scope===scope.id)))throw new Error(scope.label+"装配输入存在循环");
   el("construction-scope").innerHTML=data.constructionScopes.map(scope=>`<option value="${escape(scope.id)}">${escape(scope.label)}</option>`).join("");
  function activeCycle(){return data.cycles.find(cycle=>cycle.id===state.cycle)}
  function visibleNodes(){if(state.mode!=="cycles")return data.nodes;const ids=new Set(activeCycle().nodeIds);return data.nodes.filter(node=>ids.has(node.id))}
   function allEdges(){if(state.mode==="imports")return data.currentEdges;if(state.mode==="construction")return data.constructionEdges.filter(edge=>edge.scope===state.scope);if(state.mode==="cycles"){const ids=new Set(activeCycle().nodeIds);return data.runtimeEdges.filter(edge=>ids.has(edge.from)&&ids.has(edge.to))}return data.runtimeEdges}
  function selectedEdges(){return allEdges().filter(edge=>edge.from===state.selected||edge.to===state.selected)}
  function related(){return new Set([state.selected,...selectedEdges().flatMap(edge=>[edge.from,edge.to])])}
  function scheduleEdges(){cancelAnimationFrame(frame);frame=requestAnimationFrame(drawEdges)}
  function drawEdges(){
    const svg=el("edges"),graph=el("graph");if(!graph.offsetWidth)return;
    const rect=graph.getBoundingClientRect(),width=graph.clientWidth,height=graph.clientHeight;
    svg.setAttribute("viewBox",`0 0 ${width} ${height}`);svg.setAttribute("width",width);svg.setAttribute("height",height);
    const colors={direct:"var(--accent)",incoming:"var(--incoming)",callback:"var(--callback)"};
    const defs=`<defs>${Object.entries(colors).map(([key,color])=>`<marker id="arrow-${key}" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="${color}"/></marker>`).join("")}</defs>`;
    const buttons=new Map([...el("lanes").querySelectorAll("button[data-node]")].map(button=>[button.dataset.node,button]));
    const edges=state.showAll?allEdges():selectedEdges();
    const pairs=new Set(allEdges().map(edge=>edge.from+"|"+edge.to));
    const sorted=[...edges].sort((a,b)=>Number(a.from===state.selected||a.to===state.selected)-Number(b.from===state.selected||b.to===state.selected));
    let markup="";
    sorted.forEach((edge,index)=>{const from=buttons.get(edge.from),to=buttons.get(edge.to);if(!from||!to)return;const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();const offset=pairs.has(edge.to+"|"+edge.from)?(edge.kind==="callback"?7:-7):0;const ax=(a.left+a.right)/2-rect.left,ay=(a.top+a.bottom)/2-rect.top+offset,bx=(b.left+b.right)/2-rect.left,by=(b.top+b.bottom)/2-rect.top+offset;let x1,y1,x2,y2,c1x,c1y,c2x,c2y;
      if(Math.abs(ax-bx)<20){const side=ax>width/2?-1:1;x1=ax+side*a.width/2;y1=ay;x2=bx+side*b.width/2;y2=by;const bend=Math.min(52,24+Math.abs(ay-by)*.08)+(index%3)*3;c1x=Math.max(3,Math.min(width-3,x1+side*bend));c2x=c1x;c1y=y1;c2y=y2}
      else {const side=bx>ax?1:-1;x1=ax+side*a.width/2;y1=ay;x2=bx-side*b.width/2;y2=by;const bend=Math.max(20,Math.abs(x2-x1)*.44);c1x=x1+side*bend;c2x=x2-side*bend;c1y=y1;c2y=y2}
      const isSelected=edge.from===state.selected||edge.to===state.selected;const type=edge.kind==="callback"?"callback":edge.to===state.selected?"incoming":"direct";markup+=`<path class="edge ${type}${isSelected?"":" contextual"}" d="M${x1.toFixed(2)},${y1.toFixed(2)} C${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${x2.toFixed(2)},${y2.toFixed(2)}" marker-end="url(#arrow-${type})"><title>${escape(label(edge.from))} → ${escape(label(edge.to))}：${escape(edge.label)}</title></path>`;
    });
    svg.innerHTML=`<title id="svg-title">${escape(label(state.selected))}的子系统关系</title><desc id="svg-desc">${escape(el("direction-label").textContent)}；虚线表示有限同步回调。下方详情提供相同关系的可点击文字。</desc>${defs}${markup}`;
  }
  function renderSelector(){el("node-select").innerHTML=families.map(family=>`<optgroup label="${escape(family)}">${data.nodes.filter(node=>node.family===family).map(node=>`<option value="${escape(node.id)}"${node.id===state.selected?" selected":""}>${escape(node.label)}</option>`).join("")}</optgroup>`).join("")}
  function renderNodes(){
    const neighbors=related(),incoming=new Set(selectedEdges().filter(edge=>edge.to===state.selected).map(edge=>edge.from)),outgoing=new Set(selectedEdges().filter(edge=>edge.from===state.selected).map(edge=>edge.to)),nodes=visibleNodes();
    el("graph").classList.toggle("cycle-graph",state.mode==="cycles");
    el("lanes").innerHTML=families.map(family=>{const group=nodes.filter(node=>node.family===family);if(!group.length)return "";return `<section class="lane" aria-label="${escape(family)}"><div class="lane-title">${escape(family)}<small>${group.length}</small></div><div class="node-stack">${group.map(node=>`<button class="node${node.id===state.selected?" selected":""}${incoming.has(node.id)?" inbound":""}${outgoing.has(node.id)?" outbound":""}${!neighbors.has(node.id)&&!state.showAll?" muted":""}" type="button" data-node="${escape(node.id)}" aria-pressed="${node.id===state.selected}" aria-label="查看${escape(node.label)}"><strong>${escape(node.label)}</strong><small>${escape(shortPath(node.id))}</small></button>`).join("")}</div></section>`}).join("");
    el("lanes").style.gridTemplateColumns=state.mode==="cycles"?`repeat(${families.filter(family=>nodes.some(node=>node.family===family)).length},minmax(0,1fr))`:"";
    renderMobile();scheduleEdges();
  }
   function relationTitles(){if(state.mode==="imports")return ["导入本包","本包直接导入"];if(state.mode==="construction")return ["本阶段哪些装配需要本项","本阶段需要先就绪"];return ["允许调用本项","本项可以调用"]}
  function relationRows(incoming){return selectedEdges().filter(edge=>incoming?edge.to===state.selected:edge.from===state.selected).sort((a,b)=>label(incoming?a.from:a.to).localeCompare(label(incoming?b.from:b.to),"zh-CN"))}
  function renderMobile(){const titles=relationTitles();const node=byId.get(state.selected);el("mobile-graph").innerHTML=`<div class="mobile-selected"><small>当前选择 · ${escape(node.family)}</small><strong>${escape(node.label)}</strong></div>${[true,false].map((incoming,index)=>{const edges=relationRows(incoming);return `<section class="mobile-group"><h3>${titles[index]}</h3><div class="mobile-links">${edges.length?edges.map(edge=>{const target=incoming?edge.from:edge.to;return `<button class="mobile-node${edge.kind==="callback"?" callback":""}" type="button" data-node="${escape(target)}">${incoming?"← ":"→ "}${escape(label(target))}${edge.kind==="callback"?"<span>同步回调</span>":""}</button>`}).join(""):"<span class=\"empty\">此视角没有直接关系</span>"}</div></section>`}).join("")}`}
  function renderDetail(){
    const node=byId.get(state.selected),titles=relationTitles();
    const relationMarkup=[true,false].map((incoming,index)=>{const edges=relationRows(incoming);return `<section class="relation-group"><h3>${titles[index]} · ${edges.length}</h3>${edges.length?edges.map(edge=>{const target=incoming?edge.from:edge.to;return `<button class="relation-row ${incoming?"incoming":"outgoing"}${edge.kind==="callback"?" callback":""}" type="button" data-node="${escape(target)}"><span class="relation-arrow" aria-hidden="true">${incoming?"←":"→"}</span><span><span class="relation-name">${escape(label(target))}</span><span class="relation-label">${edge.kind==="callback"?"有限同步回调 · ":""}${escape(edge.label)}</span></span></button>`}).join(""):"<p class=\"empty\">此视角没有直接关系。</p>"}</section>`}).join("");
    el("detail").innerHTML=`<div class="detail-header"><div class="detail-kicker">${escape(node.family)} · 拟议能力边界</div><h2>${escape(node.label)}</h2><code class="detail-path">${escape(node.path)}</code><span class="scope-chip">${escape(node.scope)}</span></div><section class="detail-section"><h3>如何初始化</h3><p>${escape(node.init)}</p></section><section class="detail-section"><h3>拥有的状态或规则</h3><p>${escape(node.owner)}</p></section><section class="detail-section"><h3>运行方得到的最小能力</h3><ul>${node.api.map(api=>`<li>${escape(api)}</li>`).join("")}</ul></section><section class="detail-section limits"><h3>权限边界</h3><p>${escape(node.limits)}</p></section><section class="detail-section"><h3>设计模式落点</h3><p class="pattern">${escape(node.pattern)}</p></section><section class="detail-section"><h3>本轮拟议调整</h3><p>${escape(node.change)}</p></section><div class="detail-source"><a href="${escape(node.source)}">源码入口 ↗</a><a href="${escape(data.sourceDoc)}">完整约束 ↗</a></div><p class="detail-scope-note">${state.mode==="imports"?"箭头是当前包导入；上述能力说明是待实施规划，两者不能互相证明。":state.mode==="construction"?"这里展示关键构造输入，不表示这些纯值或函数都有独立服务实例。":"每条关系只授予所标明的有限能力，不代表可以调用对方所有方法。"}</p>`;
    el("relation-groups").innerHTML=relationMarkup;
  }
  function renderCycle(){const isCycle=state.mode==="cycles";el("cycle-bar").hidden=!isCycle;el("cycle-detail").hidden=!isCycle;if(!isCycle)return;const cycle=activeCycle();if(!el("cycle-bar").children.length)el("cycle-bar").innerHTML=data.cycles.map(item=>`<button class="cycle-choice" type="button" data-cycle="${escape(item.id)}" aria-pressed="false">${escape(item.label)}</button>`).join("");for(const button of el("cycle-bar").querySelectorAll("button"))button.setAttribute("aria-pressed",button.dataset.cycle===cycle.id);el("cycle-detail").innerHTML=`<h3>${escape(cycle.label)}</h3><p class="cycle-type">${escape(cycle.type)}</p><div class="cycle-columns"><div><h4>需要防止的风险</h4><p>${escape(cycle.risk)}</p></div><div><h4>本版简单处理方案</h4><p>${escape(cycle.solution)}</p></div></div><p class="cycle-preserve"><b>保留的语义：</b>${escape(cycle.preserve)}</p>`}
   function renderHeader(){
     const scope=data.constructionScopes.find(item=>item.id===state.scope);
     el("construction-scope-label").hidden=state.mode!=="construction";el("construction-scope").value=state.scope;
     const config={runtime:["调用权限关系","调用者 → 能力拥有者",data.relationNotes.runtime,"待实施 · 权限规划"],construction:[scope.label+"装配输入","消费者 → 必须先就绪的输入",data.relationNotes.construction+" "+scope.detail,"待实施 · "+scope.label],imports:["现行生产包导入","导入方 → 被导入包",data.relationNotes.imports,"当前源码 · 直接导入"],cycles:["风险相关的安全协作","实线为直接能力 · 虚线为有限同步回调","图中展示拟议安全交接；风险和处理方案见下方，不把同步往返当作包循环。","待实施 · 六类风险"]}[state.mode];
    el("diagram-title").textContent=config[0];el("direction-label").textContent=config[1];el("relation-note").textContent=config[2];el("context-tag").textContent=config[3];el("context-tag").className="context-tag"+(state.mode==="imports"?" current":"");el("callback-legend").hidden=state.mode==="imports"||state.mode==="construction";
    for(const button of document.querySelectorAll("button[data-mode]"))button.setAttribute("aria-pressed",button.dataset.mode===state.mode);
    const count=selectedEdges().length,total=allEdges().length;el("graph-note").innerHTML=`<strong>${escape(label(state.selected))}</strong> · ${count} 条直接关系${state.showAll?`，当前视角共 ${total} 条连线`:"；其余节点保留位置，可选择查看"}。${state.mode==="imports"&&state.selected==="host"?"宿主不属于内部包，因此没有包导入边。":""}`;
  }
  function render(){renderHeader();renderSelector();renderCycle();renderNodes();renderDetail()}
  function chooseNode(id){if(!byId.has(id))return;const restoreFocus=Boolean(document.activeElement?.dataset.node);if(state.mode==="cycles"&&!activeCycle().nodeIds.includes(id)){const cycle=data.cycles.find(item=>item.nodeIds.includes(id));if(cycle)state.cycle=cycle.id;else state.mode="runtime"}state.selected=id;render();if(restoreFocus){const button=[...el("lanes").querySelectorAll("button[data-node]")].find(item=>item.dataset.node===id);if(button&&el("graph").offsetWidth)button.focus({preventScroll:true});else el("node-select").focus({preventScroll:true})}}
  el("app").addEventListener("click",event=>{const mode=event.target.closest("button[data-mode]"),node=event.target.closest("button[data-node]"),cycle=event.target.closest("button[data-cycle]"),stage=event.target.closest("button[data-stage]");if(mode){state.mode=mode.dataset.mode;if(state.mode==="cycles"&&!activeCycle().nodeIds.includes(state.selected))state.selected=activeCycle().nodeIds[0];render()}else if(node){chooseNode(node.dataset.node)}else if(cycle){state.cycle=cycle.dataset.cycle;if(!activeCycle().nodeIds.includes(state.selected))state.selected=activeCycle().nodeIds[0];render()}else if(stage){state.stage=Number(stage.dataset.stage);renderStages()}});
   el("node-select").addEventListener("change",event=>chooseNode(event.target.value));el("show-all").addEventListener("change",event=>{state.showAll=event.target.checked;renderHeader();renderNodes()});
   el("construction-scope").addEventListener("change",event=>{if(!scopeIds.has(event.target.value))return;state.scope=event.target.value;render()});
  function renderStages(){if(!el("timeline").children.length)el("timeline").innerHTML=data.stages.map((stage,index)=>`<li><button class="stage" type="button" data-stage="${index}" aria-pressed="false"><span class="stage-number">${index}</span><span>${escape(stage.label)}</span></button></li>`).join("");for(const button of el("timeline").querySelectorAll("button"))button.setAttribute("aria-pressed",Number(button.dataset.stage)===state.stage);const stage=data.stages[state.stage];el("stage-detail").innerHTML=`<strong>${escape(stage.label)}：</strong>${escape(stage.detail)}`}
  el("references").innerHTML=data.references.map(reference=>`<li><a href="${escape(reference.url)}" target="_blank" rel="noopener noreferrer">${escape(reference.label)} ↗</a></li>`).join("")+`<li>调查基线：<code>${escape(data.baseline.slice(0,12))}</code>，排除 ${data.excludedTestPackages} 个测试构造包。</li>`;
   el("integrity").textContent="结构检查：现行导入图无环；实例、编译、单场的拟议装配输入分别无环。聚合图不代表跨作用域初始化时序，也不证明拟议行为已实施。";
  const narrow=window.matchMedia("(max-width:760px)");el("relations-detail").open=!narrow.matches;narrow.addEventListener("change",event=>{el("relations-detail").open=!event.matches});
  render();renderStages();window.addEventListener("resize",scheduleEdges);if(typeof ResizeObserver!=="undefined")new ResizeObserver(scheduleEdges).observe(el("graph"));
})();
</script>
</body>

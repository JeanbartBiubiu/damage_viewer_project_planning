name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn test（替身与仓库内 SQL，不连数据库）
        run: mvn -B -f server/data_manage/pom.xml test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: 单测与机制回归（tests/mechanisms，加载已提交的 Wasm）
        run: npm test

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasm/tinygo_engine_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wasm/tinygo_engine_v2/go.mod
          cache: false
      - run: go test -count=1 ./...

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix tools/task-governance
      - run: node tools/task-governance/cli.mjs check
